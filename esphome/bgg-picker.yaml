# ESPHome: Spielwahl-Display (Waveshare ESP32 Touch AMOLED) für BGG Collection Sync
# Benötigt ESPHome >= 2025.7 (homeassistant.action). In Home Assistant beim ESPHome-Gerät
# "Dem Gerät erlauben, Home-Assistant-Aktionen auszuführen" aktivieren.

substitutions:
  name: bgg-picker
  friendly_name: BGG Spielwahl
  # Entity-IDs aus Home Assistant eintragen (Geräte & Dienste -> BGG Collection Sync):
  suggestion_entity: sensor.boardgamegeek_DEIN_NAME_vorschlag
  session_entity: sensor.boardgamegeek_DEIN_NAME_spielsitzung

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

logger:

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

packages:
  hardware: !include hardware_waveshare_amoled.yaml
  ui: !include ui.yaml
