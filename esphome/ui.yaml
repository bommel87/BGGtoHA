# UI-Logik: Auswahl -> Vorschlag -> Ablehnen/Zusagen -> Standort + Start -> Partie läuft.
# Der Zustand (Phase, Name, Standort ...) kommt aus Home Assistant, das Display ist zustandslos.
#
# Layout für das runde 466x466-Display: Mittelpunkt (233, 233), Radius 233.
# Alle Elemente sind von der Mitte aus positioniert (align: CENTER + x/y) und so
# bemessen, dass ihre Ecken innerhalb des Kreises liegen. Schwarzer Hintergrund,
# weil schwarze Pixel auf AMOLED aus sind.

font:
  - file: "gfonts://Roboto"
    id: roboto_28
    size: 28
    glyphs: &glyphs "!\"#%&'()+,-./0123456789:?ABCDEFGHIJKLMNOPQRSTUVWXYZ abcdefghijklmnopqrstuvwxyzäöüÄÖÜß|"
  - file: "gfonts://Roboto"
    id: roboto_20
    size: 20
    glyphs: *glyphs

text_sensor:
  # --- Vorschlag ---
  - platform: homeassistant
    id: ha_phase
    entity_id: ${suggestion_entity}
    on_value:
      then:
        - if:
            condition:
              lambda: 'return x == "suggested";'
            then:
              - lvgl.page.show: page_suggest
        - if:
            condition:
              lambda: 'return x == "accepted";'
            then:
              - lvgl.page.show: page_accepted
        - if:
            condition:
              lambda: 'return x == "none";'
            then:
              - lvgl.page.show: page_none
        - if:
            condition:
              lambda: 'return x == "idle" && id(ha_session).state != "running";'
            then:
              - lvgl.page.show: page_select

  - platform: homeassistant
    id: ha_name
    entity_id: ${suggestion_entity}
    attribute: name
    on_value:
      then:
        - lvgl.label.update:
            id: lbl_sug_name
            text: !lambda 'return x;'
        - lvgl.label.update:
            id: lbl_acc_name
            text: !lambda 'return x;'

  - platform: homeassistant
    id: ha_summary
    entity_id: ${suggestion_entity}
    attribute: summary
    on_value:
      then:
        - lvgl.label.update:
            id: lbl_sug_summary
            text: !lambda 'return x;'

  - platform: homeassistant
    id: ha_location
    entity_id: ${suggestion_entity}
    attribute: location
    on_value:
      then:
        - lvgl.label.update:
            id: lbl_acc_location
            text: !lambda 'return x.empty() ? std::string("Kein Standort hinterlegt") : x;'

  # --- laufende Partie ---
  - platform: homeassistant
    id: ha_session
    entity_id: ${session_entity}
    on_value:
      then:
        - if:
            condition:
              lambda: 'return x == "running";'
            then:
              - lvgl.page.show: page_running
        - if:
            condition:
              lambda: 'return x != "running" && id(ha_phase).state == "idle";'
            then:
              - lvgl.page.show: page_select

  - platform: homeassistant
    id: ha_session_name
    entity_id: ${session_entity}
    attribute: name
    on_value:
      then:
        - lvgl.label.update:
            id: lbl_run_name
            text: !lambda 'return x;'

lvgl:
  default_font: roboto_28
  displays:
    - main_display
  touchscreens:
    - main_touch
  bg_color: 0x000000
  text_color: 0xFFFFFF
  style_definitions:
    - id: pill
      radius: 30
    - id: muted
      text_font: roboto_20
      text_color: 0xA0A0A0
  theme:
    roller:
      bg_color: 0x1E1E1E
      text_color: 0xFFFFFF
      border_width: 0
      text_font: roboto_20
  pages:
    # ------------------------------------------------------------ Auswahl
    - id: page_select
      bg_color: 0x000000
      widgets:
        - label:
            text: "Was spielen wir?"
            align: CENTER
            y: -170
        - label:
            text: "Modus"
            styles: muted
            align: CENTER
            x: -136
            y: -62
        - label:
            text: "Typ"
            styles: muted
            align: CENTER
            y: -62
        - label:
            text: "Spieler"
            styles: muted
            align: CENTER
            x: 136
            y: -62
        - roller:
            id: roller_mode
            options: ["Egal", "Koop", "Wettkampf"]
            visible_row_count: 3
            width: 130
            align: CENTER
            x: -136
            y: 20
        - roller:
            id: roller_type
            options: ["Egal", "Familie", "Strategie", "Party", "Abstrakt", "Thematisch", "Wargame", "Kinder"]
            visible_row_count: 3
            width: 130
            align: CENTER
            y: 20
        - roller:
            id: roller_players
            options: ["1", "2", "3", "4", "5", "6", "7", "8"]
            selected_index: 3
            visible_row_count: 3
            width: 130
            align: CENTER
            x: 136
            y: 20
        - button:
            id: btn_suggest
            styles: pill
            width: 240
            height: 60
            align: CENTER
            y: 130
            widgets:
              - label:
                  text: "Vorschlag"
                  align: CENTER
            on_click:
              - homeassistant.action:
                  action: bgg_collection_sync.suggest_game
                  data_template:
                    mode: "{{ mode }}"
                    game_type: "{{ gtype }}"
                    players: "{{ players }}"
                  variables:
                    mode: !lambda |-
                      static const char *v[] = {"any", "cooperative", "competitive"};
                      return std::string(v[lv_roller_get_selected(id(roller_mode))]);
                    gtype: !lambda |-
                      static const char *v[] = {"any", "family", "strategy", "party",
                                                "abstract", "thematic", "wargame", "children"};
                      return std::string(v[lv_roller_get_selected(id(roller_type))]);
                    players: !lambda |-
                      return std::to_string(lv_roller_get_selected(id(roller_players)) + 1);

    # ------------------------------------------------------------ Vorschlag
    - id: page_suggest
      bg_color: 0x000000
      widgets:
        - label:
            text: "Wie wäre es mit"
            styles: muted
            align: CENTER
            y: -150
        - label:
            id: lbl_sug_name
            text: "-"
            width: 330
            long_mode: WRAP
            text_align: CENTER
            align: CENTER
            y: -60
        - label:
            id: lbl_sug_summary
            text: ""
            styles: muted
            width: 330
            long_mode: WRAP
            text_align: CENTER
            align: CENTER
            y: 40
        - button:
            id: btn_reject
            styles: pill
            bg_color: 0x444444
            width: 150
            height: 60
            align: CENTER
            x: -82
            y: 130
            widgets:
              - label:
                  text: "Nein"
                  align: CENTER
            on_click:
              - homeassistant.action:
                  action: bgg_collection_sync.reject_suggestion
        - button:
            id: btn_accept
            styles: pill
            bg_color: 0x2E7D32
            width: 150
            height: 60
            align: CENTER
            x: 82
            y: 130
            widgets:
              - label:
                  text: "Ja"
                  align: CENTER
            on_click:
              - homeassistant.action:
                  action: bgg_collection_sync.accept_suggestion

    # ------------------------------------------------------------ Zugesagt
    - id: page_accepted
      bg_color: 0x000000
      widgets:
        - label:
            id: lbl_acc_name
            text: "-"
            width: 300
            long_mode: WRAP
            text_align: CENTER
            align: CENTER
            y: -120
        - label:
            text: "Standort"
            styles: muted
            align: CENTER
            y: -40
        - label:
            id: lbl_acc_location
            text: ""
            width: 330
            long_mode: WRAP
            text_align: CENTER
            align: CENTER
            y: 10
        - button:
            id: btn_back
            styles: pill
            bg_color: 0x444444
            width: 150
            height: 60
            align: CENTER
            x: -82
            y: 130
            widgets:
              - label:
                  text: "Zurück"
                  align: CENTER
            on_click:
              - homeassistant.action:
                  action: bgg_collection_sync.reset_suggestion
        - button:
            id: btn_start
            styles: pill
            bg_color: 0x2E7D32
            width: 150
            height: 60
            align: CENTER
            x: 82
            y: 130
            widgets:
              - label:
                  text: "Start"
                  align: CENTER
            on_click:
              - homeassistant.action:
                  action: bgg_collection_sync.start_play

    # ------------------------------------------------------------ Kein Treffer
    - id: page_none
      bg_color: 0x000000
      widgets:
        - label:
            text: "Keine (weiteren) Spiele gefunden"
            width: 320
            long_mode: WRAP
            text_align: CENTER
            align: CENTER
            y: -30
        - button:
            styles: pill
            width: 240
            height: 60
            align: CENTER
            y: 130
            widgets:
              - label:
                  text: "Neu wählen"
                  align: CENTER
            on_click:
              - homeassistant.action:
                  action: bgg_collection_sync.reset_suggestion

    # ------------------------------------------------------------ Läuft
    - id: page_running
      bg_color: 0x000000
      widgets:
        - label:
            text: "Partie läuft"
            styles: muted
            align: CENTER
            y: -130
        - label:
            id: lbl_run_name
            text: "-"
            width: 330
            long_mode: WRAP
            text_align: CENTER
            align: CENTER
            y: -20
        - button:
            styles: pill
            bg_color: 0xC62828
            width: 240
            height: 60
            align: CENTER
            y: 130
            widgets:
              - label:
                  text: "Beenden"
                  align: CENTER
            on_click:
              - homeassistant.action:
                  action: bgg_collection_sync.end_play
